{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Antonio's Blog{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'blog/style.css' %}">
</head>
<body class="mx-auto max-w-2xl space-y-6 bg-gray-900 px-4 py-10 font-sans text-gray-50">
    <header class="space-y-4">
        <h1 class="text-4xl font-bold">Antonio's Blog</h1>

        <nav class="flex gap-4">
            <a class="text-blue-500 hover:text-blue-700" href="{% url 'blog:home' %}">Home</a>
            <a class="text-blue-500 hover:text-blue-700" href="{% url 'blog:now' %}">Now</a>
            <a class="text-blue-500 hover:text-blue-700" href="{% url 'blog:archive' %}">Archive</a>
            <a class="text-blue-500 hover:text-blue-700" href="{% url 'blog:rss' %}">RSS</a>
        </nav>
    </header>

    <main class="space-y-6">
        {% block content %}
        {% endblock %}
    </main>
</body>
</html>
