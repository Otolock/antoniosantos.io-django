{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Antonio's Blog{% endblock %}</title>
    <link rel="micropub" href="{% url 'blog:micropub' %}">
    <link rel="stylesheet" href="{% static 'blog/style.css' %}">
    {% block head %}
    {% endblock %}
</head>
<body class="mx-auto max-w-2xl space-y-6 bg-sky-900 px-4 py-10 font-sans text-sky-50">
    <header class="space-y-4">
        <h1 class="text-4xl font-bold">Antonio's Blog</h1>

        <nav class="flex gap-4">
            <a class="text-cyan-200 hover:text-white" href="{% url 'blog:home' %}">Home</a>
            <a class="text-cyan-200 hover:text-white" href="{% url 'blog:now' %}">Now</a>
            <a class="text-cyan-200 hover:text-white" href="{% url 'blog:archive' %}">Archive</a>
            <a class="text-cyan-200 hover:text-white" href="{% url 'blog:rss' %}">RSS</a>
        </nav>
    </header>

    {% if messages %}
        <section class="space-y-2" aria-label="Messages">
            {% for message in messages %}
                <p class="border-l-4 border-cyan-200 bg-sky-950 px-4 py-3 text-sm text-sky-50">
                    {{ message }}
                </p>
            {% endfor %}
        </section>
    {% endif %}

    <main class="space-y-6">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="border-t border-sky-700 pt-6 text-sm text-sky-200">
        <p>
            Subscribe via
            <a class="text-cyan-200 hover:text-white" href="{% url 'blog:subscribe' %}">email</a>
            or
            <a class="text-cyan-200 hover:text-white" href="{% url 'blog:rss' %}">RSS</a>
        </p>
    </footer>
</body>
</html>
