{% extends "blog/base.html" %}

{% block title %}
Archive
{% endblock %}

{% block content %}
<h1>Archive</h1>

{% for post in posts %}
    <article>
        <h2>
            <a href="{% url 'blog:post_detail' post.slug %}">
                {{ post.title }}
            </a>
        </h2>

        {% if post.description %}
            <p>{{ post.description }}</p>
        {% endif %}
    </article>
{% empty %}
    <p>No posts yet.</p>
{% endfor %}
{% endblock %}
