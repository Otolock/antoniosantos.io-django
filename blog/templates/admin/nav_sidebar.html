{% load i18n %}
<button class="sticky toggle-nav-sidebar" id="toggle-nav-sidebar" aria-label="{% translate 'Toggle navigation' %}">
  <span aria-hidden="true"></span>
</button>
<nav class="sticky" id="nav-sidebar" aria-label="{% translate 'Sidebar' %}">
  <div class="studio-sidebar-heading">
    <span>Workspace</span>
    <button type="button" class="studio-sidebar-close" data-sidebar-close aria-label="Close navigation">×</button>
  </div>
  <label class="studio-nav-search" for="nav-filter">
    <span class="visually-hidden">{% translate 'Filter navigation items' %}</span>
    <input type="search" id="nav-filter"
           placeholder="{% translate 'Find a section…' %}"
           aria-label="{% translate 'Filter navigation items' %}">
  </label>
  {% if perms.webmentions.view_webmention %}
    <a class="studio-sidebar-inbox{% if '/moderation-queue/' in request.path %} current{% endif %}" href="{% url 'admin:moderation_queue' %}">
      <span>Moderation inbox</span>
      {% if pending_moderation_count %}<strong>{{ pending_moderation_count }}</strong>{% endif %}
    </a>
  {% endif %}
  <div class="studio-sidebar-apps">
    {% include 'admin/app_list.html' with app_list=available_apps show_changelinks=False %}
  </div>
</nav>
<button class="studio-sidebar-scrim" type="button" data-sidebar-close tabindex="-1" aria-label="Close navigation"></button>
